<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DriveX | Sign Up</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
    <a class="logo" href="index.html">DriveX</a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="store.html">Store</a>
        <a href="login.html">Login</a>
        <a href="admin.html">Admin</a>
        <span id="navUserText"></span>
        <button id="logoutButton" class="logout-button">Logout</button>
    </div>
</nav>

<section class="page-header">
    <h1>Create Account</h1>
    <p>Join DriveX today</p>
</section>

<section class="auth-container">
    <!-- רק טופס ההרשמה מופיע כאן -->
    <div class="auth-box">
        <h2>Create Account</h2>
        <form id="signupForm">
            <input type="text" id="firstName" placeholder="First Name" required>
            <input type="text" id="lastName" placeholder="Last Name" required>
            <input type="email" id="signupEmail" placeholder="Email" required>
            <input type="password" id="signupPassword" placeholder="Password" required>
            <button type="submit">Sign Up</button>
        </form>
        <!-- קישור מעבר להתחברות -->
        <p style="text-align: center; margin-top: 15px;">
            Already have an account? <a href="login.html" style="color: #007bff; text-decoration: none;">Login</a>
        </p>
    </div>
</section>

<p id="message" style="text-align: center; font-weight: bold; margin-top: 20px;"></p>

<footer class="footer">
    <p>© 2026 DriveX. All rights reserved.</p>
</footer>

<script src="/js/register.js"></script>
</body>
</html>
