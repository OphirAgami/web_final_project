<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DriveX - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- תפריט ניווט עליון של האתר -->
<nav class="navbar">
    <a class="logo" href="index.html">DriveX</a>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="store.html">Store</a>
        <a href="cart.html">Cart</a>
        <a href="support.html">Support</a>
        <a href="login.html">Login</a>
        <a href="admin.html">Admin</a>
        <span id="navUserText"></span>
        <button id="logoutButton" class="logout-button">Logout</button>
    </div>
</nav>

<!-- כותרת עמוד ההתחברות וההרשמה -->
<section class="page-header">
    <h1>Login / Create Account</h1>
    <p>Access your DriveX account or create a new customer account.</p>
</section>

<!-- אזור ראשי עם טפסים להתחברות ולהרשמה -->
<main class="auth-container">

    <!-- טופס התחברות למשתמש קיים -->
    <div class="auth-box">
        <h2>Login</h2>

        <form id="loginForm">
            <input type="text" id="loginUsername" placeholder="Username" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <!-- כאן תופיע הודעה על הצלחה או שגיאה בהתחברות -->
        <p id="loginMessage"></p>
    </div>

    <!-- טופס יצירת חשבון חדש -->
    <div class="auth-box">
        <h2>Create Account</h2>

        <form id="signupForm">
            <input type="text" id="signupUsername" placeholder="Choose username" required>
            <input type="password" id="signupPassword" placeholder="Choose password" required>
            <button type="submit">Create Account</button>
        </form>

        <!-- כאן תופיע הודעה על הצלחה או שגיאה בהרשמה -->
        <p id="signupMessage"></p>
    </div>
</main>

<!-- תחתית האתר -->
<footer class="footer">
    <p>© 2026 DriveX. All rights reserved.</p>
</footer>

<!-- קבצי JavaScript שמפעילים התחברות והרשמה -->
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
