<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DriveX | Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
    <a class="logo" href="index.html">DriveX</a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="store.html">Store</a>
        <a href="cart.html">Cart</a>
        <a href="login.html">Login</a>
        <a href="register.html">Sign Up</a>
        <a href="admin.html">Admin</a>
        <span id="navUserText"></span>
        <button id="logoutButton" class="logout-button">Logout</button>
    </div>
</nav>

<section class="page-header">
    <h1>Login</h1>
    <p>Access your DriveX account</p>
</section>

<section class="auth-container">
    <div class="auth-box">
        <h2>Login</h2>

        <form id="loginForm">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <p style="text-align: center; margin-top: 15px;">
            Don't have an account?
            <a href="register.html" style="color: #007bff; text-decoration: none;">Sign Up</a>
        </p>
    </div>
</section>

<p id="message" style="text-align: center; font-weight: bold; margin-top: 20px;"></p>

<footer class="footer">
    <p>© 2026 DriveX. All rights reserved.</p>
</footer>

<script src="/js/main.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
